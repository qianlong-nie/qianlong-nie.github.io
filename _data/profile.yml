bio:
  zh: >-
    <p>我是上海师范大学信息与机电工程学院计算机科学与技术专业的在读硕士研究生（2025 至今），预计 2028 年 6 月毕业。</p>
    <p>我的研究兴趣包括<strong>医工交叉</strong>（目前在做心音与心电信号的交叉研究）、<strong>计算机视觉与深度学习</strong>，以及<strong>人工智能赋能教育</strong>。</p>
    <p>本科期间，我参与了水稻种子萌发检测项目，用 YOLO 与 SAM 完成种子的定位和精细分割；毕业后赴广西百色支教一年，带领学生取得省级编程竞赛一等奖。此前我还曾在武警部队服役两年。</p>
  en: >-
    <p>I am a master's student in Computer Science and Technology at the College of Information, Mechanical and Electrical Engineering, Shanghai Normal University (2025 – present), expected to graduate in June 2028.</p>
    <p>My research interests include <strong>biomedical–engineering crossover</strong> (currently studying heart sound and ECG signals together), <strong>computer vision and deep learning</strong>, and <strong>AI for education</strong>.</p>
    <p>As an undergraduate I worked on a rice seed germination project, using YOLO and SAM to locate and segment seeds. After graduating I spent a year teaching in Baise, Guangxi, where my students won first prize in a provincial programming competition. I also served for two years in the People's Armed Police.</p>

